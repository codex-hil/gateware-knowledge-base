name: Catalogue CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/kb.py validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/kb.py index --check
      - run: ./ip-search --fpga ecp5 --toolchain yosys ethernet
